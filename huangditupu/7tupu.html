            }

        }

        }

</head>

                "名称": "陈循",
                "政绩": ["主持编纂《寰宇通志》", "支持易储"],
                "结局": "被英宗流放"
            }
        ];

        // 创建节点和边的容器
        const nodes = new vis.DataSet([]);
        const edges = new vis.DataSet([]);

        // 节点样式配置
        const typeStyles = {
            Person: {
                color: {
                    background: "radial-gradient(circle, #FFE4B5 0%, #E6C27A 100%)",
                    border: "#d4a76a",
                    highlight: { background: "#FFD700", border: "#DAA520" }
                },
                shape: "circle",
                borderWidth: 3,
                size: 30,
                font: {
                    color: "#5D4037",
                    size: 18,
                    face: 'Ma Shan Zheng',
                    strokeWidth: 2,
                    strokeColor: "#ffffff"
                },
                shadow: { enabled: true, color: 'rgba(0,0,0,0.3)', size: 10, x: 5, y: 5 }
            },
            Event: {
                color: {
                    background: "radial-gradient(circle, #98FB98 0%, #2E8B57 100%)",
                    border: "#3cb371",
                    highlight: { background: "#7CFC00", border: "#228B22" }
                },
                shape: "hexagon",
                borderWidth: 2,
                size: 35,
                font: {
                    color: "#1B5E20",
                    size: 16,
                    face: 'Ma Shan Zheng',
                    strokeWidth: 2,
                    strokeColor: "#ffffff"
                },
                shadow: { enabled: true, color: 'rgba(0,0,0,0.2)', size: 8 }
            },
            Organization: {
                color: {
                    background: "radial-gradient(circle, #B0E0E6 0%, #4682B4 100%)",
                    border: "#4682b4",
                    highlight: { background: "#87CEEB", border: "#4169E1" }
                },
                shape: "diamond",
                borderWidth: 2,
                size: 35,
                font: {
                    color: "#0D47A1",
                    size: 16,
                    face: 'Ma Shan Zheng',
                    strokeWidth: 2,
                    strokeColor: "#ffffff"
                },
                shadow: { enabled: true, color: 'rgba(0,0,0,0.2)', size: 8 }
            },
            Location: {
                color: {
                    background: "radial-gradient(circle, #FFA07A 0%, #CD5C5C 100%)",
                    border: "#cd5c5c",
                    highlight: { background: "#FF7F50", border: "#CD5C5C" }
                },
                shape: "square",
                borderWidth: 2,
                size: 35,
                font: {
                    color: "#8B0000",
                    size: 16,
                    face: 'Ma Shan Zheng',
                    strokeWidth: 2,
                    strokeColor: "#ffffff"
                },
                shadow: { enabled: true, color: 'rgba(0,0,0,0.2)', size: 8 }
            },
        };

        // 节点ID与类型映射
        const nodeIdToType = {};

        // 所有节点ID列表
        const allNodeIds = [];

        // 存储所有节点的名称和ID用于搜索
        const searchIndex = [];

        // 解析数据
        dataset.forEach((entity) => {
            const nodeId = entity["@id"];
            nodeIdToType[nodeId] = entity["@type"];
            allNodeIds.push(nodeId);

            // 为搜索索引添加条目
            searchIndex.push({
                id: nodeId,
                name: entity.名称,
                group: entity["@type"]
            });

            // 创建节点
            const style = typeStyles[entity["@type"]] || {};
            const node = {
                id: entity["@id"],
                label: entity.名称 || entity.名称,
                group: entity["@type"],
                title: `${entity.名称}${entity.生卒 ? `<br>生卒: ${entity.生卒}` : ''}`,
                ...style
            };

            nodes.add(node);

            const relations = {
                兄长: "兄长",
                宠臣: "宠臣",
                皇妃: "皇妃",
                相关人物: "相关",
                重要事件: "重要事件",
                被囚禁地: "囚禁于",
                参与事件: "参与",
                角色: "担任",
                相关事件: "涉及",
                铸造机构: "铸造",
                管辖机构: "管辖",
                尚书: "担任",
                政绩: "推行",
                相关事件: "关联",
                守城将领: "守城",
                官职: "官职",
                参与者: "策划",
                身份: "身份",
                军事行动: "指挥",
                现代位置: "位于",
                工艺发展: "发展",
                职能: "职能",
                著名作品: "制作",
                战绩: "战绩",
                年号对比: "年号",
                历史评价: "评价",
                主要内容: "内容",
                反对者: "反对",
                奏章: "上奏",
                政治立场: "支持",
                景泰时期职能: "执行",
                指挥使: "掌管",
                著名事件: "制造",
                政治目的: "目的",
                受害者: "受害于",
                罪名: "定罪",
                成员: "任职",
                权力变化: "改革",
                建筑特点: "特征",
                历史地位: "地位",
                地形特征: "地形",
                战略部署: "部署",
                关键人物: "关键",
                事迹: "事迹",
                结局: "结局",
                相关机构: "隶属",
                陵墓: "埋葬于",
                出生地: "出生地",
                守城策略: "策略",
                历史事件: "发生"
            };

            Object.entries(entity).forEach(([key, value]) => {
                if (relations[key]) {
                    const processRelation = (target, relationType) => {
                        if (target["@id"]) {
                            edges.add({
                                from: entity["@id"],
                                to: target["@id"],
                                label: relationType,
                                arrows: "to",
                                color: { color: "#8b0000", highlight: "#b38f2b" },
                                font: { color: "#555", size: 12 },
                                smooth: { type: "curvedCW", roundness: 0.2 }
                            });
                        }
                    };

                    if (Array.isArray(value)) {
                        value.forEach((item) => processRelation(item, relations[key]));
                    } else {
                        processRelation(value, relations[key]);
                    }
                }
            });
        });

        const options = {
            nodes: {
                font: {
                    size: 16,
                    face: 'Noto Serif SC'
                },
                borderWidth: 2,
                shadow: true,
                scaling: {
                    label: {
                        enabled: true,
                        min: 14,
                        max: 24
                    }
                }
            },
            edges: {
                arrows: { to: { scaleFactor: 0.5, enabled: true } },
                smooth: { type: "cubicBezier", forceDirection: "horizontal" },
                color: { inherit: false },
                width: 1.5
            },
            physics: {
                enabled: true,
                stabilization: {
                    enabled: true,
                    iterations: 200,
                    updateInterval: 25,
                    fit: true
                },
                barnesHut: {
                    gravitationalConstant: -3000,
                    springLength: 200,
                    springConstant: 0.02,
                    damping: 0.09,
                    avoidOverlap: 0.8
                },
                minVelocity: 0.5,
                maxVelocity: 50
            },
            layout: {
                improvedLayout: true,
                hierarchical: {
                    enabled: false
                }
            }
        };

        // 创建网络图
        const container = document.getElementById("network-container");
        const network = new vis.Network(container, { nodes, edges }, options);

        // 当前高亮节点ID
        let currentHighlightedNodeId = null;

        // 实体查找
        const getEntity = (id) => {
            return dataset.find(e => e["@id"] === id);
        };

        // 递归格式值
        const formatValue = (val) => {
            if (Array.isArray(val)) {
                return val.map(item => formatValue(item)).join('、');
            } else if (typeof val === 'object' && val !== null) {
                // 处理对象值（实体引用）
                const parts = [];
                for (const [k, v] of Object.entries(val)) {
                    if (k === '@id') continue; // 跳过特殊字段
                    parts.push(`${k}: ${formatValue(v)}`);
                }
                return parts.join(', ');
            }
            // 特殊处理以#开头的实体引用
            if (typeof val === 'string' && val.startsWith('#') && getEntity(val)) {
                const entity = getEntity(val);
                return `<span class="node-link" data-node-id="${val}">${entity.名称}</span>`;
            }
            return val;
        };

        // 显示节点信息面板
        const showNodeInfo = (nodeId) => {
            const entity = getEntity(nodeId);
            if (!entity) return;

            const panel = document.getElementById("info-panel");
            let content = `<h3>${entity.名称 || '未命名节点'}</h3>`;

            // 遍历所有属性
            Object.entries(entity).forEach(([key, value]) => {
                if (!key.startsWith("@") && key !== "名称") {
                    // 递归格式化值
                    let formattedValue = formatValue(value);

                    // 特殊处理对象值
                    if (typeof value === 'object' && value !== null && value['@id']) {
                        const refEntity = getEntity(value['@id']);
                        if (refEntity) {
                            formattedValue = `<span class="node-link" data-node-id="${value['@id']}">${refEntity.名称}</span>`;
                        }
                    }

                    content += `<p><strong>${key}：</strong>${formattedValue}</p>`;
                }
            });

            panel.innerHTML = content;
            panel.style.display = "block";

            // 高亮显示选中节点及其连接
            const connectedNodeIds = new Set([nodeId]);
            const connectedEdgeIds = network.getConnectedEdges(nodeId);

            connectedEdgeIds.forEach(edgeId => {
                const edge = edges.get(edgeId);
                connectedNodeIds.add(edge.from);
                connectedNodeIds.add(edge.to);
            });

            const updates = allNodeIds.map(id => ({
                id: id,
                opacity: connectedNodeIds.has(id) ? 1 : 0.2
            }));
            nodes.update(updates);
        };

        // 为信息面板添加事件委托
        document.getElementById('info-panel').addEventListener('click', (e) => {
            if (e.target.classList.contains('node-link')) {
                const nodeId = e.target.getAttribute('data-node-id');
                if (nodeId) {
                    // 高亮并聚焦这个节点
                    highlightNode(nodeId);
                }
            }
        });

        // 隐藏加载动画并停止物理引擎
        network.on("stabilizationIterationsDone", function () {
            document.getElementById("loading").style.display = "none";
            setTimeout(() => {
                network.setOptions({ physics: { enabled: false } });
            }, 1000);

            // 添加搜索功能初始化
            setupSearch();

            // 初始化缩放控制
            setupZoomControls();
        });

        // 添加稳定进度显示
        network.on("stabilizationProgress", function (params) {
            const loadingText = document.querySelector('.loading-text');
            const progress = Math.round((params.iterations / params.total) * 100);
            loadingText.innerHTML = `正在构建知识图谱...${progress}%`;
        });

        network.on("click", (params) => {
            if (params.nodes.length) {
                const nodeId = params.nodes[0];
                highlightNode(nodeId);
            } else {
                resetNodeAppearance();
            }
        });

        // 双击隐藏面板
        network.on("doubleClick", () => {
            document.getElementById("info-panel").style.display = "none";
            resetNodeAppearance();
        });

        // 重置所有节点为完全透明
        function resetNodeAppearance() {
            const updates = allNodeIds.map(id => ({
                id: id,
                opacity: 1
            }));
            nodes.update(updates);

            // 移除高亮标记
            if (currentHighlightedNodeId) {
                const highlightedNode = document.querySelector(`[data-node-id="${currentHighlightedNodeId}"]`);
                if (highlightedNode) {
                    highlightedNode.classList.remove('highlighted');
                }
                currentHighlightedNodeId = null;
            }
        }

        // ================== 搜索功能实现 ================== 

        // 高亮显示节点
        function highlightNode(nodeId) {
            // 移除之前的高亮效果
            if (currentHighlightedNodeId) {
                const prevHighlightedNode = document.querySelector(`[data-node-id="${currentHighlightedNodeId}"]`);
                if (prevHighlightedNode) {
                    prevHighlightedNode.classList.remove('highlighted');
                }
            }

            // 设置当前高亮节点
            currentHighlightedNodeId = nodeId;

            // 应用高亮动画效果
            setTimeout(() => {
                const highlightedNode = document.querySelector(`[data-node-id="${nodeId}"]`);
                if (highlightedNode) {
                    highlightedNode.classList.add('highlighted');

                    // 5秒后移除高亮动画
                    setTimeout(() => {
                        highlightedNode.classList.remove('highlighted');
                    }, 5000);
                }
            }, 300);

            // 聚焦到该节点
            network.focus(nodeId, {
                animation: {
                    duration: 1000,
                    easingFunction: 'easeInOutQuart'
                },
                scale: 1.2
            });

            // 选择节点
            setTimeout(() => {
                network.selectNodes([nodeId]);

                // 显示节点信息
                showNodeInfo(nodeId);
            }, 200);
        }

        // 初始化搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('search-input');
            const searchIcon = document.querySelector('.search-icon');
            const autocompleteList = document.getElementById('autocomplete-list');
            const searchHistory = document.getElementById('search-history');
            const historyItems = document.getElementById('history-items');
            const clearHistory = document.querySelector('.history-clear');
            const searchToggle = document.querySelector('.search-toggle');
            const searchMessage = document.getElementById('search-message');

            // 从localStorage加载搜索历史
            let searchHistoryData = JSON.parse(localStorage.getItem('searchHistory')) || [];
            renderSearchHistory();

            // 切换搜索历史显示/隐藏
            function toggleSearchHistory() {
                if (searchHistory.style.display === 'block') {
                    searchHistory.style.display = 'none';
                } else {
                    searchHistory.style.display = 'block';
                    renderSearchHistory();
                }
            }

            // 渲染搜索历史
            function renderSearchHistory() {
                historyItems.innerHTML = '';

                if (searchHistoryData.length === 0) {
                    historyItems.innerHTML = '<div class="no-history">暂无搜索历史记录</div>';
                    return;
                }

                // 显示最近的10条记录
                const recentHistory = searchHistoryData.slice(0, 10);
                recentHistory.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'search-history-item';
                    historyItem.innerHTML = `
                        ${item} <span>▶</span>
                    `;
                    historyItem.addEventListener('click', () => {
                        searchInput.value = item;
                        performSearch(item);
                        searchHistory.style.display = 'none';
                    });
                    historyItems.appendChild(historyItem);
                });
            }

            // 清除历史记录
            clearHistory.addEventListener('click', () => {
                searchHistoryData = [];
                localStorage.setItem('searchHistory', JSON.stringify(searchHistoryData));
                renderSearchHistory();
            });

            // 添加搜索记录
            function addToSearchHistory(query) {
                if (!query.trim()) return;

                // 过滤掉重复项
                searchHistoryData = searchHistoryData.filter(item =>
                    item.toLowerCase() !== query.toLowerCase());

                // 添加到最前面
                searchHistoryData.unshift(query);

                // 只保留最近20条
                if (searchHistoryData.length > 20) {
                    searchHistoryData = searchHistoryData.slice(0, 20);
                }

                localStorage.setItem('searchHistory', JSON.stringify(searchHistoryData));
                renderSearchHistory();
            }

            // 自动完成逻辑
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim();

                if (query.length < 1) {
                    autocompleteList.style.display = 'none';
                    return;
                }

                // 执行搜索建议
                const suggestions = searchIndex.filter(item =>
                    item.name.includes(query) ||
                    item.id.includes(query) ||
                    item.group.includes(query)
                ).slice(0, 8);

                if (suggestions.length === 0) {
                    autocompleteList.style.display = 'none';
                    return;
                }

                // 渲染建议列表
                autocompleteList.innerHTML = '';
                suggestions.forEach(item => {
                    const suggestionItem = document.createElement('div');
                    suggestionItem.className = 'autocomplete-item';
                    suggestionItem.innerHTML = `
                        <div class="item-name">${item.name}</div>
                        <div class="item-group">${item.group}</div>
                    `;
                    suggestionItem.addEventListener('click', () => {
                        searchInput.value = item.name;
                        performSearch(item.name);
                        autocompleteList.style.display = 'none';
                    });
                    autocompleteList.appendChild(suggestionItem);
                });

                autocompleteList.style.display = 'block';
            });

            // 搜索执行函数
            function performSearch(query) {
                if (!query.trim()) return;

                // 在搜索索引中查找匹配项
                const results = searchIndex.filter(item =>
                    item.name === query ||
                    item.name.includes(query) ||
                    item.id.includes(query) ||
                    item.group.includes(query)
                );

                if (results.length === 0) {
                    showSearchMessage(`没有找到匹配 "${query}" 的节点`, true);
                    return;
                }

                // 优先精确匹配项
                let targetId = results.find(item => item.name === query)?.id;
                if (!targetId) targetId = results[0].id;

                // 高亮显示匹配的节点
                highlightNode(targetId);

                // 显示成功信息
                showSearchMessage(`已定位到: ${query}`, false);

                // 添加到历史记录
                addToSearchHistory(query);
            }

            // 显示搜索反馈信息
            function showSearchMessage(message, isError) {
                searchMessage.textContent = message;
                searchMessage.style.display = 'block';
                searchMessage.style.backgroundColor = isError ? '#b30000' : '#8b0000';

                setTimeout(() => {
                    searchMessage.style.display = 'none';
                }, 3000);
            }

            // 绑定搜索事件
            searchIcon.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) performSearch(query);
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) performSearch(query);
                }
            });

            // 搜索框外部点击关闭自动完成
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#search-input') &&
                    !e.target.closest('.autocomplete-list') &&
                    !e.target.closest('.search-icon')) {
                    autocompleteList.style.display = 'none';
                }
            });

            // 搜索历史外部点击关闭
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#search-history') &&
                    !e.target.closest('.search-toggle')) {
                    searchHistory.style.display = 'none';
                }
            });

            // 切换按钮点击事件
            searchToggle.addEventListener('click', () => {
                if (searchHistory.style.display === 'block') {
                    searchHistory.style.display = 'none';
                } else {
                    searchHistory.style.display = 'block';
                    renderSearchHistory();
                }
            });
        }

        // 设置缩放控制
        function setupZoomControls() {
            document.getElementById('zoom-in').addEventListener('click', () => {
                network.moveTo({
                    scale: network.getScale() * 1.3,
                    animation: { duration: 500 }
                });
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                network.moveTo({
                    scale: network.getScale() * 0.7,
                    animation: { duration: 500 }
                });
            });
        }
    </script>
</body>

</html>
