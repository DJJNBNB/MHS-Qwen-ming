            z-index: 1000;
            max-height: 80vh;
            overflow-y: auto;
        }

        .info-panel h3 {

            color: #8b0000;
            font-size: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            font-family: 'Ma Shan Zheng', cursive;
        }

        .info-panel p {
            margin: 8px 0;
            line-height: 1.5;
        }

        .info-panel strong {

        }

        .info-panel .node-link {

        }

        .info-panel .node-link:hover {

        }

        .btn {

            text-decoration: none;
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Noto Serif SC', serif;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            position: relative;
        }

        .btn:hover {
            background: #b38f2b;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-return {

            align-items: center;
            position: fixed;
            top: 10px;
            left: 10px;
        }

        .btn-return::after {

            left: 0;

            background: rgba(255, 253, 246, 0.98);

            0% {

            }

            70% {
                box-shadow: 0 0 0 15px rgba(255, 215, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0);
            }
        }

        .highlighted {
            animation: highlight-pulse 1.5s ease;
        }

</head>

                // 处理对象值（实体引用）
                const parts = [];
                for (const [k, v] of Object.entries(val)) {
                    if (k === '@id') continue; // 跳过特殊字段
                    parts.push(`${k}: ${formatValue(v)}`);
                }
                return parts.join(', ');

            const searchInput = document.getElementById('search-input');

            const searchHistory = document.getElementById('search-history');
            const historyItems = document.getElementById('history-items');
            const clearHistory = document.querySelector('.history-clear');
            const searchToggle = document.querySelector('.search-toggle');
            const searchMessage = document.getElementById('search-message');

            // 从localStorage加载搜索历史
            let searchHistoryData = JSON.parse(localStorage.getItem('searchHistory')) || [];
            renderSearchHistory();

            // 切换搜索历史显示/隐藏
            function toggleSearchHistory() {
                if (searchHistory.style.display === 'block') {
                    searchHistory.style.display = 'none';
                } else {
                    searchHistory.style.display = 'block';
                    renderSearchHistory();
                }
            }

            // 渲染搜索历史
            function renderSearchHistory() {
                historyItems.innerHTML = '';

                if (searchHistoryData.length === 0) {
                    historyItems.innerHTML = '<div class="no-history">暂无搜索历史记录</div>';
                    return;
                }

                // 显示最近的10条记录

                recentHistory.forEach(item => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'search-history-item';
                    historyItem.innerHTML = `
                        ${item} <span>▶</span>
                    `;
                    historyItem.addEventListener('click', () => {
                        searchInput.value = item;
                        performSearch(item);
                        searchHistory.style.display = 'none';
                    });
                    historyItems.appendChild(historyItem);
                });
            }

            // 清除历史记录
            clearHistory.addEventListener('click', () => {
                searchHistoryData = [];
                localStorage.setItem('searchHistory', JSON.stringify(searchHistoryData));
                renderSearchHistory();
            });

            // 添加搜索记录
            function addToSearchHistory(query) {
                if (!query.trim()) return;

                // 过滤掉重复项
                searchHistoryData = searchHistoryData.filter(item =>
                    item.toLowerCase() !== query.toLowerCase());

                // 添加到最前面
                searchHistoryData.unshift(query);

                // 只保留最近20条
                if (searchHistoryData.length > 20) {
                    searchHistoryData = searchHistoryData.slice(0, 20);
                }

                localStorage.setItem('searchHistory', JSON.stringify(searchHistoryData));
                renderSearchHistory();
            }

            // 自动完成逻辑
            searchInput.addEventListener('input', () => {
                const query = searchInput.value.trim();

                if (query.length < 1) {
                    autocompleteList.style.display = 'none';
                    return;
                }

                // 执行搜索建议
                const suggestions = searchIndex.filter(item =>
                    item.name.includes(query) ||
                    item.id.includes(query) ||
                    item.group.includes(query)
                ).slice(0, 8);

                if (suggestions.length === 0) {
                    autocompleteList.style.display = 'none';
                    return;
                }

                // 渲染建议列表
                autocompleteList.innerHTML = '';
                suggestions.forEach(item => {
                    const suggestionItem = document.createElement('div');
                    suggestionItem.className = 'autocomplete-item';
                    suggestionItem.innerHTML = `
                        <div class="item-name">${item.name}</div>
                        <div class="item-group">${item.group}</div>
                    `;
                    suggestionItem.addEventListener('click', () => {
                        searchInput.value = item.name;
                        performSearch(item.name);
                        autocompleteList.style.display = 'none';
                    });
                    autocompleteList.appendChild(suggestionItem);
                });

                autocompleteList.style.display = 'block';
            });

            // 搜索执行函数
            function performSearch(query) {
                if (!query.trim()) return;

                // 在搜索索引中查找匹配项
                const results = searchIndex.filter(item =>
                    item.name === query ||
                    item.name.includes(query) ||
                    item.id.includes(query) ||
                    item.group.includes(query)
                );

                if (results.length === 0) {
                    showSearchMessage(`没有找到匹配 "${query}" 的节点`, true);
                    return;
                }

                // 优先精确匹配项
                let targetId = results.find(item => item.name === query)?.id;
                if (!targetId) targetId = results[0].id;

                // 高亮显示匹配的节点
                highlightNode(targetId);

                // 显示成功信息
                showSearchMessage(`已定位到: ${query}`, false);

                // 添加到历史记录
                addToSearchHistory(query);
            }

            // 显示搜索反馈信息
            function showSearchMessage(message, isError) {
                searchMessage.textContent = message;
                searchMessage.style.display = 'block';
                searchMessage.style.backgroundColor = isError ? '#b30000' : '#8b0000';

                setTimeout(() => {
                    searchMessage.style.display = 'none';
                }, 3000);
            }

            // 绑定搜索事件
            searchIcon.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) performSearch(query);
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = searchInput.value.trim();
                    if (query) performSearch(query);
                }
            });

            // 搜索框外部点击关闭自动完成
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#search-input') &&
                    !e.target.closest('.autocomplete-list') &&
                    !e.target.closest('.search-icon')) {
                    autocompleteList.style.display = 'none';
                }
            });

            // 搜索历史外部点击关闭
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#search-history') &&
                    !e.target.closest('.search-toggle')) {
                    searchHistory.style.display = 'none';
                }
            });

            // 切换按钮点击事件
            searchToggle.addEventListener('click', () => {
                if (searchHistory.style.display === 'block') {
                    searchHistory.style.display = 'none';
                } else {
                    searchHistory.style.display = 'block';
                    renderSearchHistory();
                }
            });
        }

        // 设置缩放控制
        function setupZoomControls() {
            document.getElementById('zoom-in').addEventListener('click', () => {
                network.moveTo({
                    scale: network.getScale() * 1.3,
                    animation: { duration: 500 }
                });
            });

            document.getElementById('zoom-out').addEventListener('click', () => {
                network.moveTo({
                    scale: network.getScale() * 0.7,
                    animation: { duration: 500 }
                });
            });
        }
    </script>
</body>

</html>
